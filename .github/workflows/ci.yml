name: CI

on:
  pull_request:
    branches: [main, develop]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'supabase/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig*.json'
      - 'biome.json'
      - '.dependency-cruiser.cjs'
      - '.secretlintrc.json'
  push:
    branches: [main]
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'supabase/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Lint (Biome)
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Dependency boundaries
        run: pnpm depcheck

      - name: Secret scan
        run: pnpm secretlint

      - name: Build apps
        run: pnpm --filter @apse/web build

      - name: Unit tests
        run: pnpm test
        continue-on-error: true
