name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'

      - name: Install root deps
        run: pnpm install --ignore-workspace

      - name: Lint (Biome)
        run: pnpm lint

      - name: Secret scan
        run: pnpm secretlint

      - name: Check code workspace present
        id: check_workspace
        run: |
          if [ -d "apps" ] || [ -d "packages" ] && [ -n "$(ls -A apps 2>/dev/null)" ] || [ -n "$(ls -A packages 2>/dev/null)" ]; then
            echo "has_code=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_code=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Workspace install (if code exists)
        if: steps.check_workspace.outputs.has_code == 'true'
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.check_workspace.outputs.has_code == 'true'
        run: pnpm -r --if-present typecheck

      - name: Dependency boundaries
        if: steps.check_workspace.outputs.has_code == 'true'
        run: pnpm depcheck

      - name: Build
        if: steps.check_workspace.outputs.has_code == 'true'
        run: pnpm -r --if-present build

      - name: Tests
        if: steps.check_workspace.outputs.has_code == 'true'
        run: pnpm -r --if-present test
        continue-on-error: true
